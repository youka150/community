<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- 核心发光滤镜 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 渐变色定义 -->
    <!-- AI 星芒渐变 (代表 LLM / Agent) -->
    <linearGradient id="ai-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007F" />
      <stop offset="50%" stop-color="#8A2BE2" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <!-- 趋势线渐变 (代表 Trend Analysis) -->
    <linearGradient id="trend-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00FF88" stop-opacity="1"/>
    </linearGradient>

    <!-- 背景网格图案 (代表数据底座与数据库) -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- 背景底色 -->
  <rect width="500" height="500" rx="30" fill="#0A0F1D" />
  <rect width="500" height="500" rx="30" fill="url(#grid)" />

  <g transform="translate(0, -10)">
    <!-- ==================== 1. 结构化雷达/网络圈 (代表 用户-内容-互动 三条线) ==================== -->
    <circle cx="250" cy="220" r="130" fill="none" stroke="rgba(0, 240, 255, 0.1)" stroke-width="1" stroke-dasharray="4 6" />
    <circle cx="250" cy="220" r="90" fill="none" stroke="rgba(138, 43, 226, 0.2)" stroke-width="2" stroke-dasharray="10 10" />
    <circle cx="250" cy="220" r="50" fill="none" stroke="rgba(255, 0, 127, 0.3)" stroke-width="1" />

    <!-- ==================== 2. 社会网络分析图 (代表 介数、PageRank、用户连边) ==================== -->
    <g stroke="rgba(255,255,255,0.15)" stroke-width="2">
      <!-- 连边 -->
      <line x1="160" y1="140" x2="250" y2="220" /> <!-- A to Center -->
      <line x1="350" y1="130" x2="250" y2="220" /> <!-- B to Center -->
      <line x1="250" y1="320" x2="250" y2="220" /> <!-- C to Center -->
      <line x1="160" y1="140" x2="350" y2="130" /> <!-- A to B -->
      <line x1="160" y1="140" x2="110" y2="240" /> <!-- A to D(Cluster) -->
      <line x1="110" y1="240" x2="130" y2="290" /> <!-- D to E -->
      <line x1="110" y1="240" x2="80" y2="210" />  <!-- D to F -->
      <line x1="350" y1="130" x2="390" y2="250" /> <!-- B to G -->
      <line x1="250" y1="320" x2="390" y2="250" /> <!-- C to G -->
    </g>

    <!-- KMeans 聚类节点 (左侧群体) -->
    <circle cx="110" cy="240" r="7" fill="#8A2BE2" filter="url(#soft-glow)"/>
    <circle cx="130" cy="290" r="5" fill="#8A2BE2" />
    <circle cx="80"  cy="210" r="4" fill="#8A2BE2" />
    <text x="55" y="270" fill="#8A2BE2" font-family="monospace" font-size="10" font-weight="bold">KMeans</text>

    <!-- 核心影响力用户节点 (节点大小代表影响力/PageRank) -->
    <circle cx="160" cy="140" r="14" fill="#FF007F" stroke="#fff" stroke-width="2" filter="url(#soft-glow)"/>
    <text x="110" y="125" fill="#FF007F" font-family="monospace" font-size="10" font-weight="bold">PageRank</text>

    <!-- 关键桥接者/内容节点 -->
    <circle cx="250" cy="320" r="12" fill="#00F0FF" stroke="#fff" stroke-width="2" filter="url(#soft-glow)"/>
    
    <circle cx="390" cy="250" r="9" fill="#FF8800" />
    
    <!-- LDA 主题节点 (右上角) -->
    <circle cx="350" cy="130" r="18" fill="rgba(0, 240, 255, 0.2)" stroke="#00F0FF" stroke-width="2" filter="url(#soft-glow)"/>
    <circle cx="350" cy="130" r="6" fill="#00F0FF" />
    <text x="375" y="120" fill="#00F0FF" font-family="monospace" font-size="10" font-weight="bold">LDA Topic</text>

    <!-- ==================== 3. 趋势洞察曲线 (代表 Z-score / Trend Analysis) ==================== -->
    <path d="M 60 360 C 140 360 160 250 250 220 C 330 190 350 110 440 80" 
          fill="none" stroke="url(#trend-grad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="440" cy="80" r="5" fill="#00FF88" filter="url(#soft-glow)" />

    <!-- ==================== 4. AI 智能引擎 (中心发光星芒 代表 LLM/Agent) ==================== -->
    <g transform="translate(250, 220)">
      <!-- 外部呼吸光晕 -->
      <circle cx="0" cy="0" r="30" fill="url(#ai-grad)" opacity="0.15" filter="url(#glow)"/>
      <!-- 四角星芒 (Agent 象征) -->
      <path d="M 0 -45 Q 0 0 45 0 Q 0 0 0 45 Q 0 0 -45 0 Q 0 0 0 -45 Z" fill="url(#ai-grad)" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="10" fill="#FFFFFF" />
    </g>
  </g>

  <!-- ==================== 5. 系统名称 Typography ==================== -->
  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <!-- 主标题 -->
    <text x="250" y="420" fill="#FFFFFF" font-size="28" font-weight="900" letter-spacing="4" filter="url(#soft-glow)">
      CREATIVE INSIGHT
    </text>
    <!-- 副标题 (系统全称英文缩写/说明) -->
    <text x="250" y="445" fill="#8A95A5" font-size="12" font-weight="600" letter-spacing="3" font-family="monospace">
      USER MODELING &amp; ANALYSIS AGENT SYSTEM
    </text>
    <!-- 底部的亮点装饰线 -->
    <path d="M 210 465 L 290 465" stroke="url(#ai-grad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  </g>
</svg>